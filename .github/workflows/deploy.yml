name: Deploy to Server

on:
  push:
    branches:
      - main
      - version_running_on_home_server
      # Nhập thêm các nhánh khác nếu muốn deploy tự động

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Lấy mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: Lấy tên nhánh đang được push
        id: branch_name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Triển khai trực tiếp (Không qua vòng lặp SSH)
        run: |
          echo "Đang triển khai nhánh: ${{ steps.branch_name.outputs.branch }}"
          cd /var/www/Esg_scorer
          
          # Lấy code mới nhất cho chính xác nhánh
          git fetch origin
          git reset --hard origin/${{ steps.branch_name.outputs.branch }}
          git checkout ${{ steps.branch_name.outputs.branch }}
          
          # Khởi động lại ứng dụng
          sudo systemctl restart esg_scorer
          
          echo "Triển khai hoàn tất thành công!"
